
global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend http_front
    bind *:80
    default_backend laravel_apps

backend laravel_apps
    balance roundrobin
    option httpchk GET /up
    http-check expect status 200

    retries 3
    option redispatch

    default-server inter 1s fall 2 rise 2

    server app1 app:80 check
    server app2 app2:80 check
    server app3 app3:80 check
