services:
  app:
    build: .
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      # These override the values in .env so the app talks to the db container
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: secret
    # Run migrations and the public-storage link on every start, then serve
    command: sh -c "php artisan migrate --force && (php artisan storage:link || true) && apache2-foreground"
    volumes:
      - product-images:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  product-images:
