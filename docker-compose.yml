
services:
  # First Laravel instance
  app: &laravel-app
    build: .
    image: distributed-commerce-app:local
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: secret
      DB_READ_HOST: db-replica
      DB_READ_PORT: 3306
      PERF_CACHE_ENABLED: "${PERF_CACHE_ENABLED:-true}"
      PERF_REPLICA_ENABLED: "${PERF_REPLICA_ENABLED:-false}"
      CACHE_STORE: redis
      REDIS_HOST: redis
      INVENTORY_GRPC_HOST: inventory:50051
    command: sh -c "(php artisan storage:link || true) && apache2-foreground"
    volumes:
      - product-images:/var/www/html/storage/app/public
    depends_on:
      app-migrate:
        condition: service_completed_successfully
      inventory:
        condition: service_started
    restart: unless-stopped

  # Second Laravel instance - same configuration
  app2:
    <<: *laravel-app

  # Third Laravel instance - same configuration
  app3:
    <<: *laravel-app

  # Shared database queue workers
  worker1: &queue-worker
    <<: *laravel-app
    command: php artisan queue:work database --queue=default --sleep=1 --tries=3 --timeout=30
    depends_on:
      app-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

  worker2:
    <<: *queue-worker

  worker3:
    <<: *queue-worker

  # Run database migrations only once
  app-migrate:
    build: .
    image: distributed-commerce-app:local
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: secret
      DB_READ_HOST: db-replica
      DB_READ_PORT: 3306
      PERF_CACHE_ENABLED: "${PERF_CACHE_ENABLED:-true}"
      PERF_REPLICA_ENABLED: "${PERF_REPLICA_ENABLED:-false}"
      CACHE_STORE: redis
      REDIS_HOST: redis
      INVENTORY_GRPC_HOST: inventory:50051
    command: php artisan migrate --force
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  # Load Balancer
  haproxy:
    image: haproxy:3.2-alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      app:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    restart: unless-stopped

  # Primary MySQL database
  db:
    image: mysql:8.4
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # MySQL read replica
  db-replica:
    image: mysql:8.4
    command:
      - --server-id=2
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-replica-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Configure MySQL replication
  replica-setup:
    image: mysql:8.4
    depends_on:
      db:
        condition: service_healthy
      db-replica:
        condition: service_healthy
    environment:
      ROOT_PASSWORD: root
      REPLICATION_USER: repl
      REPLICATION_PASSWORD: repl_secret
      APP_DATABASE: ecommerce
      APP_USER: ecommerce
      APP_PASSWORD: secret
    volumes:
      - ./docker/mysql/setup-replica.sh:/setup-replica.sh:ro
    entrypoint: ["sh", "/setup-replica.sh"]
    restart: "no"

  # Shared Redis cache
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared inventory service
  inventory:
    build:
      context: ./inventory-service
    expose:
      - "50051"
    environment:
      INVENTORY_DB_PATH: /data/inventory.sqlite3
    volumes:
      - inventory-data:/data

volumes:
  db-data:
  db-replica-data:
  product-images:
  inventory-data:
