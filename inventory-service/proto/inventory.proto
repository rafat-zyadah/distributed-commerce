syntax = "proto3";

package inventory;

service InventoryService {
  rpc GetStock (GetStockRequest) returns (StockReply);
  rpc SetStock (SetStockRequest) returns (StockReply);
  rpc ReserveStock (ChangeStockRequest) returns (StockReply);
  rpc ReleaseStock (ChangeStockRequest) returns (StockReply);
}

message GetStockRequest {
  string product_id = 1;
}

message SetStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message ChangeStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message StockReply {
  string product_id = 1;
  int32 quantity = 2;
}
